name: CI

on: push

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Lint (Checkstyle)
        run: ./mvnw -B checkstyle:check
      - name: Tests
        run: ./mvnw -B test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint -- --max-warnings=0
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Mock service worker is not in the production build
        run: test ! -e dist/mockServiceWorker.js

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: contract/package-lock.json
      - run: npm ci
      - name: Compile (regenerates openapi.yaml)
        run: npx tsp compile . --warn-as-error
      - name: Format (TypeSpec)
        run: npx tsp format --check "**/*.tsp"
      - name: Committed openapi.yaml is up to date
        run: |
          git diff --exit-code -- .
          # git diff не видит новый (неотслеживаемый) файл
          if [ -n "$(git status --porcelain -- .)" ]; then
            git status --porcelain -- .
            echo "::error::contract/ изменился после генерации: закоммитьте результат 'npx tsp compile .'"
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Docker image builds
        run: docker build -t calhexlet:ci .

  node-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: .nvmrc, backend/pom.xml and Dockerfile use the same Node version
        run: |
          nvmrc=$(tr -d '[:space:]' < .nvmrc)
          nvmrc=${nvmrc#v}
          pom=$(sed -n 's|.*<node\.version>v\{0,1\}\([0-9][0-9.]*\)</node\.version>.*|\1|p' backend/pom.xml)
          docker=$(sed -n 's|^FROM node:\([0-9][0-9.]*\).*|\1|p' Dockerfile)
          echo ".nvmrc=$nvmrc backend/pom.xml=$pom Dockerfile=$docker"
          if [ -z "$nvmrc" ] || [ "$nvmrc" != "$pom" ] || [ "$nvmrc" != "$docker" ]; then
            echo "::error::Версии Node расходятся: .nvmrc=$nvmrc, backend/pom.xml=$pom, Dockerfile=$docker"
            exit 1
          fi